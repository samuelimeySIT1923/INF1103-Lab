name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: Run test script
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

  docker:
    name: Build image and test inside container
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t expense-manager .

      - name: Run tests inside the container
        run: docker run --rm expense-manager python -m pytest tests -v

  
  deliver:
    name: Package Docker image
    runs-on: ubuntu-latest
    needs: [pytest, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t expense-manager .

      - name: Run tests inside the container
        run: docker run --rm expense-manager python -m pytest tests -v

      - name: Export image
        run: docker save expense-manager | gzip > expense-manager.tar.gz

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-manager-image
          path: expense-manager.tar.gz
          retention-days: 14